validators:
  V1_qwen:
    url: "http://localhost:8002/v1"
    model: "Qwen3-32B"
    type: "openai"

  V2_deepseek:
    url: "http://localhost:8005/v1"
    model: "DeepSeek-R1-Distill-Qwen-32B"
    type: "openai"

  V3_llama:
    url: "http://localhost:8004/v1"
    model: "Llama-4-Scout-17B-16E-Instruct"
    type: "openai"

  V4_claude:
    model: "claude-sonnet-4-20250514"
    type: "anthropic"

  V5_mistral:
    url: "http://localhost:8003/v1"
    model: "Mistral-Small-3.2-24B-Instruct-2506"
    type: "openai"

# Default consensus: 3 different families
default_consensus:
  validators: ["V1_qwen", "V2_deepseek", "V4_claude"]
  threshold: 2

# Validator diversity experiment configs
same_family:
  validators: ["V1_qwen", "V1_qwen", "V1_qwen"]
  threshold: 2

all_local_diverse:
  validators: ["V1_qwen", "V2_deepseek", "V3_llama"]
  threshold: 2

mixed_local_api:
  validators: ["V1_qwen", "V2_deepseek", "V4_claude"]
  threshold: 2
